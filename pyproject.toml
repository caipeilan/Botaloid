[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "botaloid"
version = "0.1.0"
description = "A chatbot that replies with lyrics from a local song library"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11,<2",
]

[tool.setuptools]
packages = ["botaloid"]
license-files = ["LICENSE"]
