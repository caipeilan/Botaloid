[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "botaloid"
version = "0.1.0"
description = "A chatbot that replies with lyrics from a local song library"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2,<3"]

[tool.setuptools]
packages = ["botaloid"]
license-files = ["LICENSE"]
